{% extends "v2/base.html" %}

{% block title %}Run - DAO{% endblock %}
{% block content %}
<div class="col flex-grow-0">
    <h1>Run</h1>
<form method="POST" action="{{url_for('v2.task_exec')}}" hx-boost="true" hx-target="#status-target" hx-push-url="false" hx-replace-url="false">
        {% for key, value in tasks.items() %}
          <button type="submit" name="task" value="{{key}}" class="btn btn-outline-secondary">{{value["name"]}}</button>
        {% endfor %}
        <a href="{{url_for('v2.task_cancel')}}" hx-boost="false" hx-get="{{url_for('v2.task_cancel')}}" hx-target="#status-target" class="btn btn-outline-danger disabled" id="run-cancel">Cancel</a>
    </form>
</div>
<div class="col mt-2 flex-grow-1 overflow-auto" id="status-target"
     hx-get="{{url_for('v2.task_state')}}" hx-trigger="load" hx-target="#status-target" hx-push-url="false">
</div>
{% endblock %}
