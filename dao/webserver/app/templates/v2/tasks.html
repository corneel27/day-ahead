{% extends "v2/base.html" %}

{% block title %}Run - DAO{% endblock %}
{% block content %}
<div class="col flex-grow-0 ">
    <h1>Run</h1>
    <form method="POST" action="{{url_for('v2.task_exec')}}" hx-boost="true" hx-target="#status-target"
          hx-push-url="false" hx-replace-url="false">
        <div class="btn-group">
            <div class="dropdown" style="z-index: 1050">
                <button class="btn-solid theme-secondary icon-nav" type="button" data-bs-toggle="menu"
                        aria-expanded="false">
                    Pick action
                </button>
                <div class="menu">
                    {% for key, value in tasks.items() %}
                        <button type="submit" name="task" value="{{key}}"
                                class="menu-item">
                            {{value["name"]}}
                        </button>
                    {% endfor %}
                </div>
            </div>
        </div>
        <div class="btn-group">
            <a href="{{url_for('v2.task_cancel')}}" hx-boost="false" hx-get="{{url_for('v2.task_cancel')}}"
               hx-target="#status-target" class="btn-subtle theme-danger disabled" id="run-cancel">Cancel</a>
        </div>
    </form>
</div>
<div class="col mt-2 flex-grow-1 overflow-auto" id="status-target"
     hx-get="{{url_for('v2.task_state')}}" hx-trigger="load" hx-target="#status-target" hx-push-url="false">
</div>
{% endblock %}
