<div class="input-group"
     hx-get="{{ url_for('v2.navigation', kind=kind, filename=filename) }}"
     hx-trigger="every 5s" hx-swap="none" hx-push-url="false">
    <a id="navigation-first" hx-swap-oob="outerHTML" class="btn-subtle theme-secondary {{ 'disabled' if show_index <= 0 else '' }}"
       href="{{url_for('v2.' + kind, i=first_index)}}">
        First
    </a>
    <a id="navigation-ffprev" hx-swap-oob="outerHTML" class="btn-subtle theme-secondary {{ 'disabled' if ffprev_index == 0 or ffprev_index == show_index else '' }}"
       href="{{url_for('v2.' + kind, i=ffprev_index)}}">
        -6h
    </a>
    <a id="navigation-prev" hx-swap-oob="outerHTML" class="btn-subtle theme-secondary {{ 'disabled' if show_index == 0 else '' }}"
       href="{{url_for('v2.' + kind, i=prev_index)}}">
        Prev
    </a>
    <input type="datetime-local" name="ts" value="{{show_ts}}"
           class="form-control m-0 col-3"
           aria-label="Timestamp for chart">
    <button class="btn-subtle theme-secondary" id="button-addon2" type="submit"><i class="bi bi-search"
                                                                                   style="font-size:100%"></i>
    </button>
    <a id="navigation-next" hx-swap-oob="outerHTML" class="btn-subtle theme-secondary {{ 'disabled' if show_index == last_index  else '' }}"
       href="{{url_for('v2.' + kind, i=next_index)}}">
        Next
    </a>
    <a id="navigation-ffnext" hx-swap-oob="outerHTML" class="btn-subtle theme-secondary {{ 'disabled' if ffnext_index >= last_index - 1 or ffnext_index == show_index  else '' }}"
       href="{{url_for('v2.' + kind, i=ffnext_index)}}">
        +6h
    </a>
    <a id="navigation-last" hx-swap-oob="outerHTML" class="btn-subtle theme-secondary {{ 'disabled' if show_index >= last_index else ''}}"
       href="{{url_for('v2.' + kind)}}">
        Last
    </a>
</div>
