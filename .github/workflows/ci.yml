name: Scenario suite

on: [push, pull_request]

env:
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/dao/prog

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  unit:
    name: Scenario suite (unit)
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        # numpy's pin in dao/requirements.txt only publishes wheels for
        # Python >= 3.12; pip can't resolve it on 3.11.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # da_debug.py imports pandas unconditionally at module level, so it's
        # needed here even though scenario-validate itself never touches it.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic pydantic-settings pandas

      - name: Validate scenario corpus
        run: python -m dao.prog.da_debug scenario-validate

      - name: Run solver-free unit tests
        run: pytest dao/tests/prog/test_scenarios.py dao/tests/prog/test_capture_replay_roundtrip.py -q

  scenarios:
    name: Scenario suite (solve)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: fixture
          MARIADB_DATABASE: dao_query_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: dao_query_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        # numpy's pin in dao/requirements.txt only publishes wheels for
        # Python >= 3.12; pip can't resolve it on 3.11.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dao/requirements.txt
          pip install pytest

      - name: Solve every scenario and build the report
        # scenario-run asserts the same thing pytest's test_scenario would
        # (same run_scenario() call, same PASS/SKIP gate) and exits non-zero
        # on any failure, so running it once here is the gate, not just a
        # report step. timeout-minutes guards a wedged solve, since there's
        # no pytest-timeout wrapping this call.
        timeout-minutes: 15
        env:
          TZ: UTC
        run: python -m dao.prog.da_debug scenario-run --report

      - name: Capture and replay round trip
        # Records a real calc_optimum() with RecordingIO, replays the
        # snapshot and checks the replay saw the same inputs and objective.
        timeout-minutes: 5
        env:
          TZ: UTC
          MPLBACKEND: Agg
          DAO_RUN_SCENARIOS: "1"
        run: pytest dao/tests/prog/test_capture_replay_roundtrip.py -q

      - name: Run isolated regression tests
        timeout-minutes: 5
        env:
          TZ: UTC
          DAO_TEST_ALLOW_SCHEMA_RESET: '1'
          DAO_TEST_MARIADB_URL: mysql+pymysql://root:fixture@127.0.0.1:3306/dao_query_test
          DAO_TEST_POSTGRESQL_URL: postgresql+psycopg2://postgres:fixture@127.0.0.1:5432/dao_query_test
        # The legacy test_dao.py and EV harness require a user's live setup.
        # The scenario corpus above exercises EV planning hermetically instead.
        run: |
          pytest -q \
            dao/tests/config/test_models.py \
            dao/tests/config/test_boiler_union.py \
            dao/tests/config/test_heating_config.py \
            dao/tests/config/test_migrations.py \
            dao/tests/config/test_roundtrip.py \
            dao/tests/config/test_loader_contracts.py \
            dao/tests/prog/test_db_consumption.py \
            dao/tests/prog/test_db_connections.py \
            dao/tests/prog/test_degree_days.py \
            dao/tests/prog/test_ev_schedule.py \
            dao/tests/prog/test_ha_data_query.py \
            dao/tests/prog/test_solar_defaults.py \
            dao/tests/prog/test_scheduler_dispatch.py \
            dao/tests/prog/test_report_forecasts.py \
            dao/tests/webserver/test_route_security.py

      - name: Publish report to the job summary
        # write_reports() runs before scenario-run's own exit code check, so
        # the report already reflects any failures even when this job goes
        # red - always() so a failing run is still readable without opening
        # the artifact.
        if: always()
        run: |
          if [ -f dao/data/scenario_reports/scenario_report_latest.md ]; then
            cat dao/data/scenario_reports/scenario_report_latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No scenario report was generated (the solve step likely crashed before producing one)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scenario report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-reports
          path: dao/data/scenario_reports/
