name: Developer start page

on:
  push:
    paths: ['docs/developer/**', '.github/workflows/developer-page.yml']
  pull_request:
    paths: ['docs/developer/**', '.github/workflows/developer-page.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test docs/developer/start.test.mjs
      - name: Prepare the static site
        run: |
          mkdir -p _site/developer
          cp docs/developer/index.html docs/developer/start.mjs docs/developer/style.css _site/developer/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: >-
      github.event_name != 'pull_request' && vars.DEVELOPER_PAGES_ENABLED == 'true' &&
      (github.ref_name == github.event.repository.default_branch ||
       github.ref_name == vars.DEVELOPER_PAGES_BRANCH)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: developer-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}developer/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
