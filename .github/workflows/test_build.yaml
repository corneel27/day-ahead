name: Test Builder

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: dao

permissions:
  contents: read

jobs:

  init:
    name: Initialize test build
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare testing build context
        run: |
          cp -a dao/* release-testing/

      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}


  build:
    name: Test build ${{ matrix.arch }}
    needs: init

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}

    permissions:
      contents: read

    steps:

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare testing build context
        run: |
          cp -a dao/* release-testing/

      - name: Test build
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}

          image: ${{ matrix.image }}

          context: release-testing

          image-tags: |
            test

          version: test

          push: "false"

          cache-gha: "true"
          cache-gha-scope: testing