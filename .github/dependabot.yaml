version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    allow:
      - dependency-name: ruff
      - dependency-name: pre-commit
      - dependency-name: pytest
      - dependency-name: debugpy
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      time: "06:00"
  - package-ecosystem: pip
    directory: "/dao"
    schedule:
      interval: daily
  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
    # Node follows the digest-pinned Active LTS tag in the Dockerfile.
    # Allow its digest refresh even when that floating tag was recently republished.
    cooldown:
      default-days: 3
      exclude: [node]
  - package-ecosystem: npm
    directory: "/dao/webserver"
    schedule:
      interval: weekly
